<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>共同账户账本</title>
<link rel="stylesheet" href="style.css?v=20261010-1">
<!-- 版本号：每次修改 js/css 时一起改（index.html 和 editor.html 保持一致），让浏览器不会混用新旧文件 -->
<script type="importmap">
{ "imports": {
  "./calc.js": "./calc.js?v=20261010-1",
  "./crypto.js": "./crypto.js?v=20261010-1",
  "./view.js": "./view.js?v=20261010-1",
  "./github.js": "./github.js?v=20261010-1",
  "./zip.js": "./zip.js?v=20261010-1"
} }
</script>
<script>
// 页面脚本没能加载（多半是浏览器缓存了旧版本文件）时给出明确提示，而不是点按钮没有反应
window.addEventListener('error', function (e) {
  var t = e.target, msg = String(e.message || '');
  if (!(t && t.tagName === 'SCRIPT') && !/import|export|module|Unexpected token/i.test(msg)) return;
  var b = document.getElementById('load-error');
  if (b) b.hidden = false;
}, true);
</script>
</head>
<body>
<div id="load-error" class="banner err" hidden style="margin:16px">页面文件没有完整加载（多半是浏览器缓存了旧版本）。请按 <b>Ctrl+F5</b>（Mac：<b>Cmd+Shift+R</b>）强制刷新；手机上请关闭这个页面后重新打开。</div>
<main>
  <section id="login" class="login card">
    <h1>共同账户账本</h1>
    <form method="post" onsubmit="return false" id="login-form">
      <input type="text" name="username" autocomplete="username" value="hurdle-ledger" class="sr-only" tabindex="-1" aria-hidden="true">
      <label class="field"><span>密码</span>
        <input id="pw" type="password" class="pw" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      </label>
      <button class="primary" type="submit" id="login-btn">解密查看</button>
      <div id="login-msg" class="small"></div>
    </form>
    <p class="small muted">数据在你的浏览器中解密，密码不会发送到任何地方。</p>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="justify-content:space-between">
      <h1 id="title" style="margin-bottom:0">共同账户账本</h1>
      <span class="row"><button type="button" id="refresh">刷新</button><button type="button" id="lock">锁定</button></span>
    </div>
    <p class="small muted" id="updated"></p>
    <div id="dash"></div>
  </section>
</main>

<dialog id="shot-dlg">
  <div class="row" style="justify-content:space-between">
    <b id="shot-title"></b>
    <button type="button" id="shot-close">关闭</button>
  </div>
  <div id="shot-body"></div>
</dialog>

<script type="module">
import { compute } from './calc.js';
import { decryptJSON, decryptBytes, imageMime, WrongPasswordError } from './crypto.js';
import { renderDashboard, esc, setupPasswordFields } from './view.js';

const $ = (id) => document.getElementById(id);
setupPasswordFields();
// 解密后的数据只保存在内存中（这两个变量），不写入任何存储
let password = null;
let data = null;
let dataHash = null;      // 当前 data.enc 的哈希，用于判断是否有新数据
let pollTimer = null;
const shotCache = new Map();

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('login-msg');
  const pw = $('pw').value;
  $('login-btn').disabled = true;
  msg.className = 'small muted';
  msg.textContent = '正在下载并解密，可能需要几秒……';
  try {
    const resp = await fetch('data.enc', { cache: 'no-store' });
    if (resp.status === 404) throw new Error('还没有数据（data.enc 不存在）。');
    if (!resp.ok) throw new Error(`下载数据失败（HTTP ${resp.status}）。`);
    const buf = await resp.arrayBuffer();
    const d = await decryptJSON(pw, buf);
    password = pw; data = d; dataHash = await hashOf(buf);
    $('pw').value = '';
    msg.textContent = '';
    show();
  } catch (err) {
    msg.className = 'small neg';
    msg.textContent = err instanceof WrongPasswordError ? '密码错误，请重试。' : (err.message || String(err));
  } finally {
    $('login-btn').disabled = false;
  }
});

function show(note = '') {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  const res = compute(data);
  renderDashboard($('dash'), data, res, { onShot });
  const t = data.updatedAt ? new Date(data.updatedAt) : null;
  $('updated').textContent = (t && !isNaN(t) ? `数据最后更新：${t.toLocaleString('zh-CN')}` : '') + (note ? `　${note}` : '');
  clearInterval(pollTimer);
  pollTimer = setInterval(checkUpdate, 3 * 60 * 1000);
}

async function hashOf(buf) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
  return [...h].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// 页面打开期间自动检查新数据：每 3 分钟一次，以及切回这个页面时
async function checkUpdate(manual = false) {
  if (!password) return;
  try {
    const resp = await fetch('data.enc', { cache: 'no-store' });
    if (!resp.ok) return;
    const buf = await resp.arrayBuffer();
    const h = await hashOf(buf);
    if (h === dataHash) { if (manual) show('已是最新数据'); return; }
    const d = await decryptJSON(password, buf);
    data = d; dataHash = h;
    for (const u of shotCache.values()) URL.revokeObjectURL(u);
    shotCache.clear();
    show('已自动更新为最新数据');
  } catch (err) {
    if (err instanceof WrongPasswordError) {
      // 管理人修改了密码：回到登录界面
      $('lock').click();
      $('login-msg').className = 'small neg';
      $('login-msg').textContent = '数据已更新且密码已更改，请输入新密码。';
    }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
$('refresh').addEventListener('click', () => checkUpdate(true));

$('lock').addEventListener('click', () => {
  password = null; data = null; dataHash = null;
  clearInterval(pollTimer);
  for (const u of shotCache.values()) URL.revokeObjectURL(u);
  shotCache.clear();
  $('dash').innerHTML = '';
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
});

async function onShot(r) {
  const dlg = $('shot-dlg');
  $('shot-title').textContent = `${r.period || ''} ${r.date} 截图`;
  const body = $('shot-body');
  body.innerHTML = '<p class="spinner">正在下载并解密截图……</p>';
  dlg.showModal();
  try {
    let url = shotCache.get(r.shot);
    if (!url) {
      const resp = await fetch('shots/' + encodeURIComponent(r.shot), { cache: 'no-store' });
      if (!resp.ok) throw new Error(`截图文件不存在或无法下载（HTTP ${resp.status}）：shots/${r.shot}`);
      const bytes = await decryptBytes(password, await resp.arrayBuffer());
      url = URL.createObjectURL(new Blob([bytes], { type: imageMime(bytes) }));
      shotCache.set(r.shot, url);
    }
    body.innerHTML = `<img alt="截图" src="${url}">`;
  } catch (err) {
    body.innerHTML = `<p class="neg">${esc(err instanceof WrongPasswordError ? '截图无法用当前密码解密（可能还没有用新密码重新加密上传）。' : err.message)}</p>`;
  }
}
$('shot-close').addEventListener('click', () => $('shot-dlg').close());
</script>
</body>
</html>
